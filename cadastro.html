<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">    
    <link rel="stylesheet" href="style.css">
    <title>Cadastro - panelinhas.com</title>
</head>
<body>
    <header class="cabecalho">
            <div id="caixa-busca">
                <input type="text" id="busca-texto" placeholder="pesquisar receita...">
                <img src="icone-busca.png" id="botao-busca" alt="icone-busca">
            </div>
            <nav>
                <li class="logo-site"><img src="logo_Panelas.png" alt="Logo Panelinhas" width="300" height="200"></li>
                <li><a href="#">Receitas...</a></li>
            </nav>
            
        </header>
    <hr id="listra_cabecalho">
    <main class="cadastro">
        <h2>Cadastro</h2>
        <form action="" method="post">
            <fieldset> 
                <label for="nome_cadastro">Nome</label>
                <input type="text" id="nome_cadastro" name="nome_cadastro" required><br>

                <label for="usuario_cadastro">Nome de Usuário:</label>
                <input type="text" id="usuario_cadastro" name="usuario_cadastro" required><br>
                
                <!-- Idade e Data de nascimento não ficaria repetitivo ?
                <label for="idade_cadastro">Idade</label>
                <input type="range" id="idade_cadastro" name="idade_cadastro" min="18" max="120" value="18" oninput="saida.value = this.value + ' Ano(s)'" required>
                <output id="saida" for="idade_cadastro">18 Ano(s)</output><br>
                -->

                <label for="data_nasc_cadastro">Data de Nascimento</label>
                <input type="date" id="data_nasc_cadastro" name="data_nasc_cadastro" required><br>

                <label>Sexo:</label>
                <input type="radio" id="mas" name="sexo_cadastro" value="mas" checked>
                <label for="mas">Masculino</label>
                <input type="radio" id="fem" name="sexo_cadastro" value="fem">
                <label for="fem">Feminino</label>
                <input type="radio" id="nin" name="sexo_cadastro" value="nin">
                <label for="nin">Não informar</label><br>
                
                <label for="fone_cadastro">Celular</label>
                <input type="tel" id="fone_cadastro" name="fone_cadastro" placeholder="99 99999-9999" pattern="[0-9]{2} [0-9]{5}-[0-9]{4}" required><br>

                <label for="mail_cadastro">E-mail</label>
                <input type="email" id="mail_cadastro" name="mail_cadastro" required><br>

                <label for="senha_cadastro">Senha:</label>
                <input type="password" id="senha_cadastro" name="senha_cadastro" required><br>
        
                <label for="senha_cadastro">Confirme sua senha:</label>
                <input type="password" id="senhaConf_cadastro" name="senhaConf_cadastro" required><br>            
            </fieldset>
        </form>
    </main>
    <footer>
        <p>Desenvolvido por...</p>

        <aside>
            <p>Siga as nosssas redes sociais</p>
            <nav>
                <a href=""><img src="facebook-icone.png" alt="facebook" width="50"></a>
                <a href=""><img src="instagram-icone.webp" alt="instagram-icone" width="50"></a>
            </nac>
        </aside>
    </footer>
</body>
</html>
